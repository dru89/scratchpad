[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.2"
edition = "2024"
publish = false

[workspace.dependencies]
scratchpad-core = { path = "crates/core" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
comrak = { version = "0.55", default-features = false }
directories = "6"
loro = "1.16"
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
ulid = "3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
